mplate-columns:minmax(150px,1.8fr) repeat(3,minmax(90px,1fr)) minmax(50px,.5fr) 18px;gap:8px;align-items:center}.ledgerhead{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:9px 10px}.repo-row{width:100%;text-align:left;border-top:1px solid var(--line);padding:16px 10px;font-size:13px}.repo-row b{display:block;font-size:15px;letter-spacing:-.03em}.repo-row small,.project small{display:block;font:11px var(--mono);color:var(--muted);margin-top:4px}.portfolio-counts{display:flex;gap:18px;flex-wrap:wrap;font-size:12px}.portfolio-counts b{font:22px var(--mono);margin-right:4px}.repo-detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px}.repo-detail .metrics{margin-top:12px}.healthline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filterline{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px;gap:12px}.filterline select,input{border:1px solid #adbbb0;border-radius:4px;background:var(--white);color:var(--ink);padding:7px 10px;font-size:13px}.filterline input{min-width:0;width:100%}.foot{padding:16px 0 25px;border-top:1px solid #afbbb3;font:11px var(--mono);color:var(--muted)}dialog{border:1px solid #85998a;border-radius:8px;padding:0;background:var(--white);color:var(--ink);width:min(470px,calc(100vw - 30px));max-height:85vh;box-shadow:0 15px 60px #13271c33}dialog::backdrop{background:#142c2580}.dialoghead{padding:15px 20px;border-bottom:1px solid var(--line);background:#edf1e9}.dialoghead h2{font-size:17px}.close{font:20px var(--mono);width:32px;height:32px}.dialogbody{padding:20px}.dialogbody input{width:100%;margin-bottom:10px}.project{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 0;text-align:left;border-bottom:1px solid var(--line)}.dialogbody .darkbtn{margin-top:15px}.empty{font-size:13px;padding:14px 0;color:var(--muted)}.insight{display:grid;gap:10px;margin-top:18px}.insight li{line-height:1.45}.board-title+.sub{margin-top: <body><main class="wrap"><header class="mast"><div class="brand"><i class="mark" aria-hidden="true"></i> Beads <span class="rule"></span><span class="quiet">Design studies</span></div><span class="mini">Application architecture</span></header>
<section class="hero"><h1>Framework explorer</h1><p>Three ways to manage repository health, issues and development workflow across your projects.</p></section>
<nav class="concepts" aria-label="Choose a layout proposal"><button data-design="0" aria-pressed="true"><span class="tabnum">01 /</span> Repository workbench <span class="go">↘</span></button><button data-design="1" aria-pressed="false"><span class="tabnum">02 /</span> Workflow board <span class="go">↘</span></button><button data-design="2" aria-pressed="false"><span class="tabnum">03 /</span> Portfolio matrix <span class="go">↘</span></button></nav>
<section class="frame" aria-label="Interactive layout preview"><div class="screenbar"><div class="screenbrand"><i class="mark" aria-hidden="true"></i>Framework explorer</div><div id="context"></div></div><div id="screen"></div><footer class="statusbar"><span id="scopeStatus"></span><span>Illustrative snapshot · 10:42 UTC</span></footer></section>
<section class="notes" id="notes" aria-label="Layout rationale and trade-offs"></section><footer class="foot">Beads &nbsp;/&nbsp; Framework explorer layout study</footer></main>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle"></h2><button class="close" aria-label="Close dialog" data-close>×</button></div><div class="dialogbody" id="dialogBody"></div></dialog>
<script>
'use strict';
// Each proposal reads the same fictional snapshot so differences reflect the layout.
const projects = [
 {name:'beads-tracker',branch:'main',sha:'c7e18a4',modified:2,areas:3,open:24,ready:8,blocked:3,ext:4,files:286,symbols:'3,842',lag:2,change:'Repository health pane',stage:'Plan review',prefix:'BT',issues:['Surface index freshness','Keep repository selection on restart','Group extension checks'],sync:'10:41',checked:'10:40'},
 {name:'atlas-core',branch:'develop',sha:'23ad81c',modified:0,areas:1,open:12,ready:5,blocked:0,ext:3,files:152,symbols:'1,920',lag:0,change:'Module discovery',stage:'Execute',prefix:'AC',issues:['List active modules','Cache module summaries','Document discovery filters'],sync:'10:42',checked:'10:42'},
 {name:'relay-cli',branch:'release',sha:'b7d09e2',modified:1,areas:2,open:9,ready:3,blocked:1,ext:2,files:98,symbols:'814',lag:0,change:'Release diagnostics',stage:'Spec review',prefix:'RC',issues:['Refresh sync metadata','Explain pending exports','Add release summary'],sync:'09:16',checked:'10:42',pending:2},
 {name:'docs-kit',branch:'main',sha:'178a2fa',modified:0,areas:0,open:4,ready:2,blocked:0,ext:0,files:0,symbols:'—',lag:0,change:'',stage:'',prefix:'DK',issues:['Index help topics','Add onboarding examples'],sync:'10:39',checked:'—',untracked:true}
];
const tools=['GRACE5','br','Gortex'];
const study=[
 [['Recommended default','A repository workbench','Use this when one repository stays open for most of the day. Its name opens a searchable project list with health summaries. The left rail belongs to work inside that repository.'],['Daily work','One canvas, one inspector','Overview brings pinned issues and the active change together. Issues, Workflow and Intelligence reuse the canvas. The health inspector stays visible as you move between them.'],['Trade-off','Width buys context','The inspector reduces space for wide issue tables. On narrow screens navigation becomes a row and health follows the work area. A compact health button brings checks directly into reach.']],
 [['Best fit','Change-driven delivery','Use the board when the next owner decision matters most. Specification, plan and execution form the primary columns. Each change opens its gate, linked issue and evidence.'],['Project access','Keep the board in context','The repository button switches the entire board. Open issues from the board header. The lower drawer holds repository diagnostics and can collapse while you review changes.'],['Trade-off','Gates take the foreground','This layout gives dependencies and handoffs room, but finding an individual issue takes another step. On small screens stages stack in workflow order with diagnostics below.']],
 [['Best fit','Multi-project oversight','Scan managed repositories by exception. Compare GRACE5, br and Gortex in aligned columns, then open the affected repository in one step. Unconfigured tools have their own state.'],['Project access','Two levels of navigation','The matrix is a full portfolio destination. Selecting a row replaces it with a project sheet containing issues, workflow and health. All projects restores the matrix and its filter.'],['Trade-off','An extra step into daily work','Choose this when sessions usually begin with “which repository needs me?” On phones each row becomes a labeled block. The same health labels survive the change in shape.']]
];
let design=0, current=0, page='Overview', drawer=true, sheet=false, attention=false, filter='All', search='';
const $=id=>document.getElementById(id), p=()=>projects[current];
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function pill(label,type=''){return `<span class="pill ${type}">${type==='warn'?'△':type==='idle'?'–':'●'} ${label}</span>`}
function state(r,i){if(i===0)return r.ext?['Healthy','']:['Absent','idle'];if(i===1)return r.pending?['Pending','warn']:['Synced',''];return r.untracked?['Untracked','idle']:r.lag?['Stale','warn']:['Current','']}
function alerts(r){return tools.filter((_,i)=>state(r,i)[1]==='warn').length}
function detail(r,i){if(i===0)return r.ext?`v5.0.2 · ${r.ext} extensions loaded`:'Framework not installed';if(i===1)return `v0.1.24 · ${r.pending?r.pending+' pending exports':'last sync '+r.sync}`;return r.untracked?'Repository outside graph':r.lag?`${r.lag} commits behind · ${r.files} files`:`${r.files} files · ${r.symbols} symbols`}
function facts(rows){return `<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`}
function toolRow(i){const r=p();return `<button class="rowbtn" data-tool="${i}"><span class="toolmark ${['gr','br','gx'][i]}">${['G⁵','br','Gx'][i]}</span><span><span class="tool-head"><strong>${tools[i]}</strong>${pill(...state(r,i))}</span><small>${detail(r,i)}</small></span><span class="right">›</span></button>`}
function toolFacts(i){const r=p();if(i===0)return r.ext?facts([['Installed version','5.0.2'],['Extensions loaded',`${r.ext} of ${r.ext}`],['Extension inventory',['Schema checks','Change navigation','Review notes','Command reports'].slice(0,r.ext).join(' · ')],['Integrity','Passed · 0 findings'],['Active gate',r.stage],['Checked','10:42 UTC']]):facts([['Installation','Absent'],['Extensions','Unavailable'],['Gate','No governed change']]);if(i===1)return facts([['CLI version','0.1.24'],['Issue store','Readable'],['Last successful sync',r.sync+' UTC'],['Pending exports',r.pending||0],['Open / ready / blocked',`${r.open} / ${r.ready} / ${r.blocked}`],['Checked','10:42 UTC']]);return r.untracked?facts([['Daemon','Reachable'],['Repository graph','Untracked'],['Index statistics','Unavailable']]):facts([['Daemon','Reachable'],['Selected view',r.branch+' · working tree'],['Index freshness',r.lag?`${r.lag} commits behind HEAD`:'Matches HEAD'],['Files / symbols',`${r.files} / ${r.symbols}`],['Last indexed',r.checked+' UTC'],['Next inspection',r.lag?'Inspect queued indexing work':'Browse indexed symbols']])}
function repoFacts(){const r=p();return facts([['Branch',r.branch],['HEAD',r.sha],['Working tree',r.modified?`${r.modified} modified files`:'Clean'],['Vs. upstream',`${r.areas} ahead · 0 behind`]])}
function inspector(){const n=alerts(p());return `<aside class="inspect"><div class="kicker quiet">Inspector</div><div class="section-head"><h3>Repository health</h3></div><p class="intro">${n?n+' check needs attention':'No outstanding warnings'}</p>${tools.map((_,i)=>toolRow(i)).join('')}<details><summary>Git working tree</summary>${repoFacts()}</details></aside>`}
function metrics(){const r=p();return `<div class="metrics">${[['Open issues',r.open,'All'],['Ready',r.ready,'Ready'],['Blocked',r.blocked,'Blocked']].map(([a,b,f])=>`<button class="metric" data-filter="${f}"><strong>${b}</strong><small>${a} ↗</small></button>`).join('')}</div>`}
function changeBox(){const r=p();if(!r.ext)return '<p class="empty">GRACE5 is absent from this repository.</p>';const step=r.stage==='Execute'?3:r.stage==='Plan review'?2:0;return `<div class="changebox"><div class="switch-line"><span class="mini">C-${r.prefix}-07</span><span class="id">${r.stage}</span></div><h4><button style="text-align:left;padding:0" data-change="active">${r.change} ↗</button></h4><div class="steps" aria-label="Current stage ${r.stage}">${Array.from({length:5},(_,i)=>`<i class="${i<step?'done':i===step?'now':''}"></i>`).join('')}</div></div>`}
const issueState=(r,i)=>i===0&&r.blocked?'Blocked':i===1?'Ready':'Open';
function issueRow(r,i){return `<button class="issue" data-issue="${i}"><span class="id">${r.prefix}-${32-i}</span><span>${r.issues[i]}</span><span class="go">↗</span></button>`}
function issueList(){const r=p();const rows=r.issues.map((name,i)=>({name,i})).filter(x=>(filter==='All'||issueState(r,x.i)===filter)&&(`${x.name} ${r.prefix}-${32-x.i}`).toLowerCase().includes(search.toLowerCase()));return rows.map(x=>issueRow(r,x.i)).join('')||'<p class="empty">No matching sample issues.</p>'}
function issueArea(){return `<div class="section-head"><h3>Issues</h3><span class="mini">Sample results</span></div><div class="filterline"><input id="issueSearch" aria-label="Search sample issues" placeholder="Search issues…" value="${esc(search)}"><select id="issueFilter" aria-label="Issue status">${['All','Ready','Blocked'].map(v=>`<option ${v===filter?'selected':''}>${v}</option>`).join('')}</select></div><div id="results">${issueList()}</div>`}
function overview(){const r=p();return `${metrics()}<div class="section-head"><h3>Active change</h3><span class="mini">GRACE5</span></div>${changeBox()}<div class="section-head"><h3>Pinned issues</h3><span class="count">${Math.min(r.issues.length,2)}</span></div>${r.issues.slice(0,2).map((_,i)=>issueRow(r,i)).join('')}`}
function workbench(){const r=p();const labels=['Overview','Issues','Workflow','Intelligence'];let body=overview();if(page==='Issues')body=issueArea();if(page==='Workflow')body=`<div class="section-head"><h3>Current change</h3></div>${changeBox()}${r.ext?facts([['Lifecycle',r.stage],['Evidence','Specification, plan and run log'],['Owner decision',r.stage.includes('review')?'Awaiting owner approval':'Gate cleared']]):''}`;if(page==='Intelligence')body=`<div class="section-head"><h3>Code intelligence</h3></div>${toolFacts(2)}`;return `<div class="workspace"><nav class="rail" aria-label="Repository sections"><p class="kicker">Workspace</p>${labels.map((a,i)=>`<button class="${a===page?'active':''}" ${a===page?'aria-current="page"':''} data-page="${a}"><span class="ico" aria-hidden="true">${['⊞','≡','⇢','⌘'][i]}</span>${a}</button>`).join('')}</nav><div class="canvas"><div class="eyeline"><span class="kicker">Repository / ${page}</span><button class="lightbtn" data-health>Health ↗</button></div><h2 class="repo">${r.name}</h2><p class="sub"><span class="mono">⑂ ${r.branch}</span> &nbsp;·&nbsp; ${r.modified?r.modified+' modified files':'Clean working tree'}</p>${body}</div>${inspector()}</div>`}
function laneCards(){const r=p();if(!r.ext)return [[],[],[]];const active=r.stage==='Execute'?2:r.stage==='Plan review'?1:0;const groups=[[],[],[]];groups[active].push(['active','07',r.change,r.stage]);groups[(active+1)%3].push(['secondary','09',['Issue export format','Graph view selector','Check report history'][(active+1)%3],['Draft specification','Plan drafted','Assertions running'][(active+1)%3]]);return groups}
function board(){const r=p();return `<div class="full"><div class="boardhead"><div><div class="eyeline"><span class="kicker">${r.name} / Workflow</span></div><h2 class="board-title">Change board</h2><p class="sub">${r.ext?'2 active changes':'No governed changes'} · ${r.branch}</p></div><button class="lightbtn" data-filter="All">Issue queue · ${r.open} ↗</button></div><div class="lanes">${laneCards().map((list,i)=>`<section class="lane"><h3>${['Specification','Plan','Execution'][i]}<span class="count">${list.length}</span></h3>${list.map(([key,id,title,status])=>`<button class="workcard" data-change="${key}"><span class="id">C-${r.prefix}-${id}</span><h4>${title}</h4><span class="sub">${status} ↗</span></button>`).join('')||'<p class="empty">No active change</p>'}</section>`).join('')}</div></div><div class="drawer"><button class="drawer-head split" aria-expanded="${drawer}" data-drawer><span>Repository diagnostics</span><span class="count">${alerts(r)} warnings &nbsp; ${drawer?'▴':'▾'}</span></button>${drawer?`<div class="drawer-grid">${tools.map((_,i)=>toolRow(i)).join('')}</div>`:''}</div>`}
function portfolio(){if(sheet){const r=p();return `<div class="full"><button class="back" data-matrix>← All projects</button><div class="portfoliohead"><div><h2 class="repo">${r.name}</h2><p class="sub">${r.branch} · ${r.modified?r.modified+' modified files':'Clean working tree'}</p></div><button class="lightbtn" data-git>Inspect working tree ↗</button></div><div class="toolgrid">${tools.map((_,i)=>toolRow(i)).join('')}</div><div class="repo-detail"><section><h3>Issue activity</h3>${metrics()}${r.issues.slice(0,2).map((_,i)=>issueRow(r,i)).join('')}</section><section><div class="section-head"><h3>Active change</h3><span class="mini">Workflow</span></div>${changeBox()}</section></div></div>`}return `<div class="full"><div class="portfoliohead"><div><div class="eyeline"><span class="kicker">Portfolio / Health</span></div><h2 class="board-title">Managed repositories</h2></div><div class="portfolio-counts"><span><b>04</b> projects</span><span><b>02</b> need attention</span></div></div><div class="section-head"><h3>Repository matrix</h3><button class="lightbtn" data-attention aria-pressed="${attention}">${attention?'Show all projects':'Needs attention only'}</button></div><div class="ledger"><div class="ledgerrow ledgerhead"><span>Repository</span><span>GRACE5</span><span>br</span><span>Gortex</span><span>Open</span><span></span></div>${projects.map((r,i)=>attention&&!alerts(r)?'':`<button class="ledgerrow repo-row" data-project="${i}"><span><b>${r.name}</b><small>⑂ ${r.branch}</small></span>${tools.map((t,j)=>`<span class="cell" data-label="${t}">${pill(...state(r,j))}</span>`).join('')}<span class="count">${r.open}<span class="mini"> open</span></span><span class="go">↗</span></button>`).join('')}</div></div>`}
function render(){const r=p();document.querySelectorAll('[data-design]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===design)));$('context').innerHTML=design===2&&!sheet?'<span class="id" style="color:#cfddce">Portfolio view</span>':`<button class="scope" data-projects aria-haspopup="dialog" aria-label="Switch repository, current repository ${r.name}">⑂ &nbsp;${r.name} &nbsp;⌄</button>`;$('screen').innerHTML=[workbench,board,portfolio][design]();$('scopeStatus').textContent=design===2&&!sheet?'Scope / All managed repositories':`Scope / ${r.name} / ${r.branch}`;$('notes').innerHTML=study[design].map(([tag,title,copy])=>`<article><span class="mini">${tag}</span><h3>${title}</h3><p>${copy}</p></article>`).join('')}
const dlg=$('dialog');function show(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;if(!dlg.open)dlg.showModal()}
function projectList(term=''){return projects.map((r,i)=>r.name.includes(term.toLowerCase())?`<button class="project" data-project="${i}"><span><b>${r.name}</b><small>${r.open} open issues · ${r.branch}</small></span>${alerts(r)?pill('Attention','warn'):r.untracked?pill('Partial coverage','idle'):pill('Healthy')}</button>`:'').join('')||'<p class="empty">No matching repositories.</p>'}
function openProjects(){show('Managed projects',`<input id="projectSearch" aria-label="Find a repository" placeholder="Find a repository…"><div id="projects">${projectList()}</div>`);$('projectSearch').focus()}
function openIssues(f){filter=f;search='';if(design===0){page='Issues';render()}else{show(p().name+' / Issue queue',issueArea())}}
function changeDetail(key){const r=p();const item=laneCards().flat().find(x=>x[0]===key);if(!item)return;const status=item[3];const pending=status.includes('review');show(item[2],`<span class="kicker">${r.name} / C-${r.prefix}-${item[1]}</span>${facts([['Stage',status],['Next step',pending?'Owner reviews the '+(status==='Plan review'?'plan':'specification'):status==='Execute'||status.includes('running')?'Inspect target assertion results':'Prepare the next owner review'],['Evidence',status==='Plan review'?'Approved specification · Draft plan':status==='Spec review'||status.includes('specification')?'Draft specification':status==='Plan drafted'?'Approved specification · Draft plan':'Approved plan · Assertion run log']])}<button class="lightbtn" style="margin-top:12px" data-issue="0">Linked issue ${r.prefix}-32 ↗</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target===dlg)dlg.close();return}const d=b.dataset;if('close'in d){dlg.close();return}if('design'in d){design=Number(d.design);sheet=false;render();return}if('projects'in d){openProjects();return}if('project'in d){current=Number(d.project);page='Overview';filter='All';search='';sheet=design===2;if(dlg.open)dlg.close();render();return}if('page'in d){page=d.page;render();document.querySelector(`[data-page="${page}"]`).focus();return}if('health'in d){show(p().name+' / Repository health',tools.map((_,i)=>toolRow(i)).join('')+repoFacts());return}if('tool'in d){const i=Number(d.tool);show(tools[i]+' health',`<div class="switch-line"><span class="kicker">${p().name}</span>${pill(...state(p(),i))}</div>${toolFacts(i)}`);return}if('filter'in d){openIssues(d.filter);return}if('issue'in d){const i=Number(d.issue),r=p();show(r.issues[i],`<span class="kicker">${r.name} / ${r.prefix}-${32-i}</span>${facts([['Status',issueState(r,i)],['Priority',i===0?'High':'Normal'],['Linked change',r.ext?r.change:'None'],['Pinned',i<2?'Yes':'No']])}`);return}if('change'in d){changeDetail(d.change);return}if('drawer'in d){drawer=!drawer;render();document.querySelector('[data-drawer]').focus();return}if('matrix'in d){sheet=false;render();document.querySelector('[data-attention]').focus();return}if('attention'in d){attention=!attention;render();document.querySelector('[data-attention]').focus();return}if('git'in d)show(p().name+' / Git working tree',repoFacts())});
document.addEventListener('input',e=>{if(e.target.id==='projectSearch')$('projects').innerHTML=projectList(e.target.value);if(e.target.id==='issueSearch'){search=e.target.value;$('results').innerHTML=issueList()}});document.addEventListener('change',e=>{if(e.target.id==='issueFilter'){filter=e.target.value;$('results').innerHTML=issueList()}});render();
</script></body></html>
